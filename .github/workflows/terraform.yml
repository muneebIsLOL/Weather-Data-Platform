name: Terraform CI/CD

on:
  push:
    branches:
      - "aws-migration"
    paths:
      - "terraform/environments/dev/**"
      - "terraform/environments/prod/**"
  pull_request:
    branches:
      - "aws-migration"
  workflow_dispatch:

permissions:
  id-token: write
  contents: read
  security-events: write 
  pull-requests: write

jobs:
  code-quality:
    runs-on: ubuntu-latest
    steps:
      - name: Check Out Repo
        uses: actions/checkout@v7

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.15.8"
          terraform_wrapper: false

      - name: Validate Dev Code
        working-directory: terraform/environments/dev
        run: |
          terraform init -backend=false
          terraform fmt -check
          terraform validate

      - name: Validate Prod Code
        working-directory: terraform/environments/prod
        run: |
          terraform init -backend=false
          terraform fmt -check
          terraform validate

      - name: Run Trivy vulnerability scanner in IaC mode
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: "config"
          scan-ref: "terraform/"
          hide-progress: true
          format: "sarif"
          output: "trivy-results.sarif"
          exit-code: "1"
          severity: "CRITICAL,HIGH"

      - name: Upload Trivy scan results to GitHub Security tab
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: "trivy-results.sarif"

  deploy-dev:
    needs: code-quality
    runs-on: ubuntu-latest
    steps:
      - name: Check Out Repo
        uses: actions/checkout@v7

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.15.8"
          terraform_wrapper: false
          
      - name: Debug OIDC Claims
        uses: github/actions-oidc-debugger@v1
        with:
          audience: sts.amazon.com

      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/TerraformDevRole
          aws-region: "ap-south-1"
          audience: sts.amazon.com

      - name: Terraform Init
        working-directory: terraform/environments/dev
        run: |
          terraform init -reconfigure \
            -backend-config="bucket=${{ secrets.TF_BACKEND_BUCKET }}" \
            -backend-config="key=terraform/${{ github.ref_name }}/terraform.tfstate" \
            -backend-config="use_lockfile=true" \
            -backend-config="region=ap-south-1"

      - name: Terraform Plan
        working-directory: terraform/environments/dev
        if: github.event_name == 'pull_request'
        run: terraform plan -input=false -out=tfplan

      - name: Terraform Apply
        working-directory: terraform/environments/dev
        if: github.ref == 'refs/heads/aws-migration' && github.event_name == 'push'
        run: terraform apply -input=false -auto-approve
        
      - name: Make Logs Folder
        working-directory: terraform/environments/dev
        if: failure()
        run: |
          mkdir -p logs
          terraform show > logs/plan_error.txt

      - name: Upload Test Logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: terraform-dev-logs
          path: terraform/environments/dev/logs/

  deploy-prod:
    needs: deploy-dev
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Check Out Repo
        uses: actions/checkout@v7

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.15.8"
          terraform_wrapper: false

      - name: Debug OIDC Claims
        uses: github/actions-oidc-debugger@v1
        with:
          audience: sts.amazon.com

      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/TerraformProdRole
          aws-region: "ap-south-1"
          audience: sts.amazon.com

      - name: Terraform Init
        working-directory: terraform/environments/prod
        run: |
          terraform init -reconfigure \
            -backend-config="bucket=${{ secrets.TF_BACKEND_BUCKET }}" \
            -backend-config="key=terraform/${{ github.ref_name }}/terraform.tfstate" \
            -backend-config="use_lockfile=true" \
            -backend-config="region=ap-south-1"

      - name: Terraform Plan
        working-directory: terraform/environments/prod
        if: github.event_name == 'pull_request'
        run: terraform plan -input=false -out=tfplan

      - name: Terraform Apply
        working-directory: terraform/environments/prod
        if: github.ref == 'refs/heads/aws-migration' && github.event_name == 'push'
        run: terraform apply -input=false -auto-approve

      - name: Make Logs Folder
        working-directory: terraform/environments/prod
        if: failure()
        run: |
          mkdir -p logs
          terraform show > logs/plan_error.txt

      - name: Upload Test Logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: terraform-prod-logs
          path: terraform/environments/prod/logs/
